name: GSVPad
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    PRODUCT_BUNDLE_IDENTIFIER: com.lunar0cean.gsvpad
    CODE_SIGNING_ALLOWED: "NO"
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager.git
    exactVersion: 1.24.2
targets:
  GSVPad:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Frontend/**"
      # 文本处理脚本和词典数据作为资源打进 App，由 JavaScriptCore 运行
      - path: App/Frontend
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        # 文件共享的两项声明写在 Config/Info.plist 里，其余由 Xcode 生成后合并进去
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: GPT Sovits
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        SUPPORTS_MACCATALYST: "NO"
        # native/ 里的 Rust 库：先由 cargo 编译成静态库，再在这里链接。真机和模拟器各一份
        SWIFT_OBJC_BRIDGING_HEADER: App/Native/gsv_native.h
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/native/target/aarch64-apple-ios/release"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/native/target/aarch64-apple-ios-sim/release"
        OTHER_LDFLAGS: "$(inherited) -lgsv_native -liconv -lresolv"
  GSVPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GSVPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunar0cean.gsvpad.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  GSVPad:
    build:
      targets:
        GSVPad: all
    test:
      targets: [GSVPadTests]
      gatherCoverageData: false
